name: CI

on:
  push:
  pull_request:

# Read-only token for every job; nothing here needs to write to the repository.
permissions:
  contents: read

# A newer push to the same branch cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: verification
          POSTGRES_PASSWORD: verification_ci_password
          POSTGRES_DB: verification_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U verification -d verification_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      # Optional: lets the OCR robustness tests run instead of skipping.
      # The test suite itself never needs network (DNS/WHOIS are mocked).
      - name: Install OCR binaries
        run: |
          # packages.microsoft.com sometimes answers 403, which makes `apt-get update` exit 100.
          sudo grep -l "packages.microsoft.com" /etc/apt/sources.list.d/* 2>/dev/null | xargs -r sudo rm -f
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tesseract-ocr poppler-utils

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Run frontend unit tests
        run: npm --prefix frontend test -- --reporter=dot

      - name: Build frontend
        run: npm --prefix frontend run build

      - name: Install Python dependencies
        run: pip install -r requirements-dev.txt

      # Pyflakes-class errors only (unused imports/variables, undefined names, syntax errors).
      # A wider rule set would touch many files; widen it deliberately, not here.
      - name: Lint (ruff, pyflakes rules)
        run: python -m ruff check app tests scripts eval --select F,E9 --isolated

      - name: Dependency audit (all severities)
        run: python -m pip_audit -r requirements.txt --strict

      - name: Dependency audit of the exact deployed versions (lock file)
        run: python -m pip_audit -r requirements.lock --strict --no-deps --disable-pip

      - name: Import every app module
        env:
          DATABASE_URL: "sqlite://"
        run: python -c "import importlib, pkgutil, app; [importlib.import_module(m.name) for m in pkgutil.walk_packages(app.__path__, 'app.')]"

      - name: Migrations apply cleanly and match the models
        env:
          DATABASE_URL: "postgresql://verification:verification_ci_password@localhost:5432/verification_db"
        run: |
          python -m alembic upgrade head
          python -m alembic check

      - name: Run tests
        env:
          DATABASE_URL: "postgresql://verification:verification_ci_password@localhost:5432/verification_db"
          REDIS_TEST_URL: "redis://localhost:6379"
        run: python -m pytest -rs -q

      - name: Eval (curated cases must keep their expected bands)
        run: python eval/run_eval.py

  # Browser end-to-end flows (analyze, payment-demand floor, consent, withdrawal, dispute, dashboard).
  # Runs against ephemeral SQLite with offline fixtures; no external lookups and no real data.
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          pip install -r requirements-dev.txt
          npm ci --prefix frontend

      - name: Install Playwright browser
        run: npx --prefix frontend playwright install --with-deps chromium

      - name: Run end-to-end tests
        run: npm --prefix frontend run test:e2e

      - name: Keep traces when the run fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: frontend/test-results
          retention-days: 7

