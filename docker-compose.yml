# Credentials come from .env (copy .env.example to .env and change them).
# Only the web service is published to the host; Postgres is reachable only
# on the internal compose network. Redis was removed: nothing in the app uses it.

services:
  web:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      # Overrides the localhost URL in .env with the compose service name.
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      # Absolute path inside the container; the snapshot built by scripts/load_mca_master.py
      # (or sync_ogd_master.py) lives in ./data on the host and is mounted read-only.
      MCA_DB_PATH: /app/data/mca_master.sqlite3
    volumes:
      - ./data:/app/data:ro
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
